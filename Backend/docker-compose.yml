services:
  # la base de datos PostgreSQL; los datos se guardan en el volumen "datos".
  # en la computadora usa el puerto 5433, porque el 5432 ya lo ocupa el PostgreSQL de Windows
  base:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data

  # la API, construida con el Dockerfile de esta carpeta
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: base # dentro de Docker, la base se encuentra por el nombre del servicio
      DB_PORT: "5432"
    ports:
      - "8080:8080"
    volumes:
      - archivos:/app/uploads # los archivos subidos no se pierden al apagar
    depends_on:
      - base
    restart: on-failure # si arranca antes de que la base esté lista, lo vuelve a intentar

volumes:
  datos:
  archivos:
